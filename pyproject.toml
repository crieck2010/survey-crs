[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-crs"
version = "0.1.0"
description = "CRS registry and coordinate transforms for the land-surveying suite: 345 EPSG-researched entries (NAD83(2011) SPCS, WGS 84 UTM, geographic), pure-stdlib projection engine with optional survey-geodesy backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Charles Rieck" }]
keywords = ["surveying", "crs", "coordinate-reference-system", "state-plane", "utm", "datum", "epsg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
geodesy = ["survey-geodesy"]

[project.scripts]
crs = "crs.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-crs"
Repository = "https://github.com/crieck2010/survey-crs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
